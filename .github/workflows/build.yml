name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
      - name: InstallNDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Check
        id: c
        run: |
          if [ -f "app/src/main/jniLibs/arm64-v8a/libppsspp_libretro_android.so" ]; then
            echo "p=true" >> $GITHUB_OUTPUT
          else
            echo "p=false" >> $GITHUB_OUTPUT
          fi
      - name: Clone
        if: steps.c.outputs.p == 'false'
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/libretro/ppsspp.git libretro-ppsspp
      - name: BuildCore
        if: steps.c.outputs.p == 'false'
        run: bash scripts/build_core.sh
      - name: VerifyCore
        run: |
          SO="app/src/main/jniLibs/arm64-v8a/libppsspp_libretro_android.so"
          [ -f "$SO" ] || exit 1
          ls -lh "$SO"
      - name: SetupGradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: GrantGradlew
        run: |
          [ -f gradlew ] && chmod +x gradlew || true
      - name: RestoreKeystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/pssp.keystore
          ls -lh app/keystore/pssp.keystore

      - name: BuildAPK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: LocateAPK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          [ -n "$APK" ] || exit 1
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "size=$(du -h $APK | cut -f1)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: UltramanFE0-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
