name: Build APK
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Check
        id: c
        run: |
          if [ -f "app/src/main/jniLibs/arm64-v8a/libppsspp_libretro_android.so" ]; then
            echo "p=true" >> $GITHUB_OUTPUT
          else
            echo "p=false" >> $GITHUB_OUTPUT
          fi
      - name: Clone
        if: steps.c.outputs.p == 'false'
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/libretro/ppsspp.git libretro-ppsspp
      - name: BuildCore
        if: steps.c.outputs.p == 'false'
        run: bash scripts/build_core.sh
      - name: SetupGradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: BuildAPK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UltramanFE0-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
